security:
    access_control: 
        - { path: ^/admin, roles: ROLE_ADMIN }

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_memory:
            memory:
                users:
                    admin: { password: '$2y$13$eGycvlIl89.p.qLbbkjrUeDqwi5POmHTkqX7RxUib6pdUflquv03G', roles: ['ROLE_ADMIN'] }

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/  # Disables security for assets
            security: false

        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: /login  # Route for login page
                check_path: /login   # Symfony will handle login processing
            logout:
                path: /logout
                target: /

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 
                time_cost: 3
                memory_cost: 10
