parameters:

services:

    # Default configuration for all services in this file
    _defaults:
        autowire: true      # Automatically inject dependencies in your services
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Register the PdfGenerator service correctly
    App\Service\PdfGenerator:
        autowire: true
        autoconfigure: true  

    # Make all controllers available as services
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']
        autowire: true
        autoconfigure: true
        public: true  

    # Automatically register services in src/Service/ while excluding unnecessary directories
    App\Service\:
        resource: '../src/Service/'
        autowire: true
        autoconfigure: true  

    # Register all services in src/ but exclude unnecessary directories
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Migrations/'
            - '../src/Tests/'

    # Register AnimalHealthController correctly
    App\Controller\AnimalHealthController:
        arguments:
            $httpClient: '@http_client'
